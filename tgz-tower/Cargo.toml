# Tower — experimental agent-team feature for TGZTerminal.
# Untracked (see /tgz-tower/ in the repo .gitignore). This is its own Cargo
# workspace so the root workspace never sees it.
[workspace]
resolver = "2"
members = ["proto", "core", "towerd"]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tower-proto = { path = "proto" }
tower-core = { path = "core" }
