name: TGZTerminal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgzterminal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  check:
    name: Check and targeted tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check workspace
        run: |
          cargo check
          cargo check -p wezterm-escape-parser
          cargo check -p wezterm-cell
          cargo check -p wezterm-surface
          cargo check -p wezterm-ssh

      - name: Test config agent UI
        run: cargo test -p config agent_ui_tests

      - name: Test GUI sidebar agent module
        run: cargo test -p wezterm-gui termwindow::render::sidebar::tests

      - name: Test escape parser
        run: cargo test -p wezterm-escape-parser
