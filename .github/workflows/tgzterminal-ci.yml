name: TGZTerminal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgzterminal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  check:
    name: Check and targeted tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check workspace
        run: |
          cargo check
          cargo check -p wezterm-escape-parser
          cargo check -p wezterm-cell
          cargo check -p wezterm-surface
          cargo check -p wezterm-ssh

      - name: Test config agent UI
        run: cargo test -p config agent_ui_tests

      - name: Test config portable mode
        run: cargo test -p config portable_tests

      - name: Test GUI sidebar agent module
        run: cargo test -p wezterm-gui termwindow::render::sidebar::tests

      - name: Test last-session snapshot
        run: cargo test -p wezterm-gui termwindow::tgz_last_session

      - name: Test secret masking
        run: cargo test -p wezterm-gui termwindow::tgz_secret_mask

      - name: Test SSH host list
        run: cargo test -p wezterm-gui termwindow::tgz_ssh_hosts

      - name: Test Worktree panel
        run: cargo test -p wezterm-gui file_tree

      - name: Test updater asset matching
        run: cargo test -p wezterm-gui update::tests

      - name: Test escape parser
        run: cargo test -p wezterm-escape-parser

  windows-installer-script:
    name: Windows installer script
    # Compiles ci/tgzterminal-windows-installer.iss without a cargo build. Inno
    # never inspects file contents, so empty placeholders satisfy [Files] and the
    # whole script — including the Pascal [Code] block — gets syntax checked.
    # Worth a job of its own: iscc cannot run on the macOS dev machine, so
    # without this a typo in the installer only surfaces at release time.
    runs-on: windows-latest
    if: github.repository != 'wezterm/wezterm'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Inno Setup the runner image already carries (6.7.1 built the
      # tgz-v2026.10.15 installer). Chocolatey only when it is missing or older
      # than the 6.3 the script needs: it is a third-party service that has
      # been down (503/504) for whole afternoons.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = $null
          if (Test-Path $iscc) {
            # ISCC.exe's own version fields are blank or 0.0.0.0, so ask the
            # entry Inno Setup's installer writes for uninstalling ("6.7.1"),
            # then the file fields. Each source is logged.
            $keys = @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
            )
            $sources = @()
            foreach ($key in $keys) {
              $sources += (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).DisplayVersion
            }
            $info = (Get-Item $iscc).VersionInfo
            $sources += @($info.ProductVersion, $info.FileVersion)
            Write-Host "Inno Setup version sources: [$($sources -join '] [')]"
            foreach ($text in $sources) {
              if ($text -match '^(\d+\.\d+(\.\d+)?)') {
                $candidate = [version]$Matches[1]
                if ($candidate.Major -gt 0) {
                  $version = $candidate
                  break
                }
              }
            }
          } else {
            Write-Host "No $iscc on the runner"
          }
          if ($version -and $version -ge [version]"6.3") {
            Write-Host "Using the runner's Inno Setup $version"
          } else {
            Write-Host "No Inno Setup >= 6.3 on the runner (found: $version); installing 6.3.3"
            choco install innosetup --version=6.3.3 --no-progress -y --allow-downgrade --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile the installer script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release/mesa
          for f in tgzterminal.exe wezterm-gui.exe wezterm-mux-server.exe \
                   strip-ansi-escapes.exe libEGL.dll libGLESv2.dll conpty.dll \
                   OpenConsole.exe fzf.exe mesa/opengl32.dll ; do
            : > "target/release/$f"
          done
          "$ISCC" //DMyAppName=TGZTerminal //DMyAppVersion=0.0.0 \
                  //DMyVersionInfoVersion=0.0.0.0 \
                  //FTGZTerminal-Setup-lint ci/tgzterminal-windows-installer.iss
          test -f TGZTerminal-Setup-lint.exe
