name: TGZTerminal Windows Release

# Windows counterpart to tgzterminal-release.yml. Triggered by the same
# `tgz-v*` tags so a single release carries both the macOS .dmg and the Windows
# build. Both artifacts are required; a missing one fails the run. Produces:
#   * TGZTerminal-Setup-<tag>.exe — Inno Setup installer
#     (ci/tgzterminal-windows-installer.iss). Per-user by default, no admin
#     prompt; an elevated run can choose an all-users install instead.
#   * TGZTerminal-windows-portable-<tag>.zip — unzip and run TGZTerminal.cmd, no
#     install required. Ships a `.portable` marker, which is what makes a
#     wezterm.lua next to the binaries outrank the user's own config; the
#     installed build deliberately has no marker and so ignores that directory.
#   * A .sha256 sidecar for each.
# Both use the ANGLE GL backend bundled in assets/windows. x64 only: the
# vendored ANGLE/conpty/OpenConsole/mesa/fzf payload is x64, so arm64 machines
# run the x64 build under emulation.
#
# NOTE: if the fork's additive code does not compile on windows-msvc, the build
# step is where that surfaces — fix compile errors and re-tag.
#
# Manual runs (workflow_dispatch) build and upload the portable zip as a CI
# artifact only; they do not publish a Release.

on:
  push:
    tags: ["tgz-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgzterminal-windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Build & publish Windows release
    runs-on: windows-latest
    if: github.repository != 'wezterm/wezterm'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/tgz-v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            IS_RELEASE=1
            # Bake the version only for a real release, so the in-app updater
            # compares against releases/latest. A manual run must NOT bake
            # "dev-..." into the binary: is_release_build() in update.rs keys off
            # the tgz- prefix, and a baked dev string would misreport the build.
            printf '%s' "${VERSION}" > .tag
            echo "Baked version: ${VERSION}"
          else
            VERSION="dev-$(git -c core.abbrev=8 show -s --format=%cd-%h --date=format:%Y%m%d-%H%M%S)"
            IS_RELEASE=0
            echo "Not a release ref; leaving .tag alone (version: ${VERSION})"
          fi
          # A dotted numeric version for VERSIONINFO, which cannot take the
          # tgz-vYYYY.MM.PATCH form: tgz-v2026.08.5 -> 2026.8.5.0.
          if [[ "${VERSION}" =~ ^tgz-v([0-9]+)\.0*([0-9]+)\.0*([0-9]+)$ ]]; then
            VINFO="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          else
            VINFO="0.0.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "vinfo=${VINFO}" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binaries
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p wezterm -p wezterm-gui -p wezterm-mux-server -p strip-ansi-escapes

      - name: Stage portable package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          pkg="TGZTerminal-windows-portable-${VERSION}"
          rm -rf "$pkg" && mkdir -p "$pkg/mesa"
          # Core binaries. The `wezterm` package's [[bin]] is renamed to
          # `tgzterminal` (see wezterm/Cargo.toml), so that's what cargo
          # actually produces here — not wezterm.exe.
          cp target/release/tgzterminal.exe \
             target/release/wezterm-gui.exe \
             target/release/wezterm-mux-server.exe \
             target/release/strip-ansi-escapes.exe \
             "$pkg/"
          # ConPTY + ANGLE GL runtime (bundled assets — primary Windows backend).
          cp assets/windows/conhost/conpty.dll \
             assets/windows/conhost/OpenConsole.exe \
             assets/windows/angle/libEGL.dll \
             assets/windows/angle/libGLESv2.dll \
             "$pkg/"
          # fzf, so the worktree/file-browser feature works out of the box —
          # see ci/fetch-fzf.sh for the pinned version + checksum.
          chmod +x ci/fetch-fzf.sh
          ci/fetch-fzf.sh windows amd64 "$pkg/fzf.exe"
          # Mesa software GL is optional; include it only if the build produced it.
          if [ -f target/release/mesa/opengl32.dll ]; then
            cp target/release/mesa/opengl32.dll "$pkg/mesa/"
          else
            rmdir "$pkg/mesa"
            echo "note: target/release/mesa/opengl32.dll not present; shipping ANGLE only"
          fi
          # Friendly launcher so coworkers don't have to hunt for wezterm-gui.exe.
          printf '@echo off\r\nstart "" "%%~dp0wezterm-gui.exe" %%*\r\n' > "$pkg/TGZTerminal.cmd"
          # Portable mode marker: with this present, a wezterm.lua, colors/ and
          # wezterm_modules/ sitting next to these binaries take precedence over
          # the user's own (config::PORTABLE_MARKER). The installer never ships
          # one, so an installed build reads only the user's config.
          printf 'This file enables portable mode: configuration, colors and wezterm_modules next to these binaries take precedence over your user configuration. Delete it to use only your user configuration.\r\n' > "$pkg/.portable"
          7z a -tzip "${pkg}.zip" "$pkg" >/dev/null
          echo "PKG_ZIP=${pkg}.zip" >> "$GITHUB_ENV"

      # ci/tgzterminal-windows-installer.iss uses ArchitecturesAllowed=
      # x64compatible, which needs Inno Setup 6.3 or newer. Only install the
      # pinned version when the runner image doesn't already carry a
      # sufficient one - choco refuses to "install" over a newer preinstalled
      # version without --allow-downgrade, which previously hard-failed CI on
      # runner images that ship a newer Inno Setup than our pin.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.3.3 --no-progress -y
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VINFO="${{ steps.ver.outputs.vinfo }}"
          # The Inno script reads files from target/release; stage the runtime
          # DLLs the build script does not place there itself.
          cp assets/windows/conhost/conpty.dll \
             assets/windows/conhost/OpenConsole.exe \
             assets/windows/angle/libEGL.dll \
             assets/windows/angle/libGLESv2.dll \
             target/release/
          chmod +x ci/fetch-fzf.sh
          ci/fetch-fzf.sh windows amd64 target/release/fzf.exe
          # An installed tree must never carry the portable marker.
          rm -f target/release/.portable
          # The .iss lists every payload file explicitly with no
          # skipifsourcedoesntexist, so report all of them at once rather than
          # letting iscc fail on whichever it reaches first.
          missing=()
          for f in tgzterminal.exe wezterm-gui.exe wezterm-mux-server.exe \
                   strip-ansi-escapes.exe libEGL.dll libGLESv2.dll conpty.dll \
                   OpenConsole.exe fzf.exe mesa/opengl32.dll ; do
            [ -f "target/release/$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            printf 'missing installer payload: %s\n' "${missing[@]}"
            exit 1
          fi
          setup="TGZTerminal-Setup-${VERSION}"
          "$ISCC" //DMyAppName=TGZTerminal //DMyAppVersion="${VERSION}" \
                  //DMyVersionInfoVersion="${VINFO}" \
                  //F"${setup}" ci/tgzterminal-windows-installer.iss
          # OutputDir=.. is relative to the .iss in ci/, so iscc writes to the
          # repo root.
          test -f "${setup}.exe"
          echo "SETUP_EXE=${setup}.exe" >> "$GITHUB_ENV"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          for f in TGZTerminal-windows-portable-*.zip TGZTerminal-Setup-*.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TGZTerminal-windows
          path: |
            TGZTerminal-windows-portable-*.zip
            TGZTerminal-Setup-*.exe
            *.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: steps.ver.outputs.is_release == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TGZTerminal-windows-portable-*.zip
            TGZTerminal-Setup-*.exe
            *.sha256
          fail_on_unmatched_files: true
