<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- One soft drop shadow; the plate itself is flat -->
    <filter id="plateShadow" x="-12%" y="-10%" width="124%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Flat squircle plate -->
  <rect x="46" y="46" width="420" height="420" rx="94" ry="94"
        fill="#1D262B"
        filter="url(#plateShadow)"/>

  <!-- 2. The two loading arcs, one solid blue -->
  <path d="M 155.6,356.4 A 142,142 0 0,1 155.6,155.6"
        fill="none" stroke="#4A80B8" stroke-width="18" stroke-linecap="round"/>
  <path d="M 356.4,155.6 A 142,142 0 0,1 356.4,356.4"
        fill="none" stroke="#4A80B8" stroke-width="18" stroke-linecap="round"/>

  <!-- 3. The <T prompt -->
  <path d="M 218,212 L 168,256 L 218,300"
        fill="none" stroke="#4A80B8" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 244,206 H 340 C 342,206 346,210 346,212 V 226 C 346,228 342,232 340,232 H 306 V 298 C 306,302 302,304 299,304 H 285 C 282,304 278,302 278,298 V 232 H 244 C 242,232 238,228 238,226 V 212 C 238,210 242,206 244,206 Z"
        fill="#58A6FF"/>
  <circle cx="292" cy="322" r="6" fill="#58A6FF"/>
</svg>
